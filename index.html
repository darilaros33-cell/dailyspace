<!DOCTYPE html>
<html lang="en" class="dark">
<head><link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Space - Discipline Over Motivation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgDark: '#080B18',
                        surface: '#11172A',
                        surfaceLight: '#1E2640',
                        primary: '#7657FF',
                        primaryHover: '#6342E8',
                        secondary: '#3185FF',
                        muted: '#929BB2',
                        success: '#36C98F',
                        warning: '#FFB84D',
                        danger: '#FF657A',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        html:not(.dark) body { background-color: #F8FAFC; color: #0F172A; }
        html:not(.dark) .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        html:not(.dark) aside, html:not(.dark) header, html:not(.dark) #mobile-menu { background-color: #FFFFFF !important; border-color: #E2E8F0 !important; }
        html:not(.dark) .bg-surface { background-color: #FFFFFF !important; }
        html:not(.dark) .bg-surfaceLight { background-color: #F1F5F9 !important; }
        html:not(.dark) .text-muted { color: #64748B !important; }
        html.dark body { background-color: #080B18; color: #FFFFFF; }
        html.dark .glass-panel { background: rgba(17, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.3); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row selection:bg-primary selection:text-white transition-colors duration-300">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="app-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="glass-panel w-full max-w-md p-6 rounded-2xl shadow-2xl border border-white/10 m-4">
            <h3 id="modal-title" class="text-xl font-bold mb-2">Modal Title</h3>
            <p id="modal-desc" class="text-muted text-sm mb-6">Modal description text goes here.</p>
            <div id="modal-content" class="mb-6"></div>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2 rounded-xl bg-surfaceLight hover:bg-surfaceLight/80 text-sm font-medium transition">Cancel</button>
                <button id="modal-confirm" class="px-4 py-2 rounded-xl bg-primary hover:bg-primaryHover text-sm font-medium transition">Confirm</button>
            </div>
        </div>
    </div>

    <div id="razorpay-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden">
        <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl border border-white/10 m-4 space-y-6">
            <div class="flex items-center justify-between border-b border-white/10 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-warning/20 text-warning flex items-center justify-center font-bold">RZP</div>
                    <div>
                        <h3 class="font-bold text-lg">Razorpay Secure Checkout</h3>
                        <p class="text-xs text-muted">Daily Space Pro Subscription</p>
                    </div>
                </div>
                <button onclick="closeRazorpayModal()" class="p-2 rounded-xl bg-surfaceLight text-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="bg-surfaceLight/50 p-4 rounded-2xl border border-white/5 flex items-center justify-between">
                <div>
                    <p class="text-sm font-bold">Daily Space PRO (Monthly)</p>
                    <p class="text-xs text-muted">AI, Expense Tracker, Games & Calendar</p>
                </div>
                <span class="text-lg font-bold text-warning">₹39 / mo</span>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeRazorpayModal()" class="flex-1 py-3 rounded-xl bg-surfaceLight text-sm font-medium">Cancel</button>
                <button onclick="executeRazorpayPayment()" class="flex-1 py-3 rounded-xl bg-warning text-bgDark font-bold text-sm shadow-lg shadow-warning/20">Pay ₹39 Now</button>
            </div>
        </div>
    </div>

    <!-- Desktop Sidebar Navigation -->
    <aside class="hidden md:flex flex-col w-64 bg-surface border-r border-white/5 p-5 shrink-0 justify-between select-none">
        <div>
            <div class="flex items-center gap-3 px-2 mb-8">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg shadow-primary/20">
                    <i data-lucide="compass" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">DAILY SPACE</h1>
                    <p class="text-[10px] text-muted tracking-widest uppercase">Discipline > Motivation</p>
                </div>
            </div>

            <div class="bg-surfaceLight/50 border border-white/5 p-3.5 rounded-2xl mb-6">
                <div class="flex items-center justify-between mb-2">
                    <span id="sidebar-level" class="text-xs font-bold text-primary uppercase tracking-wider">Level 1 Beginner</span>
                    <span id="sidebar-xp" class="text-xs text-muted">0 / 100 XP</span>
                </div>
                <div class="w-full bg-bgDark h-2 rounded-full overflow-hidden">
                    <div id="sidebar-xp-bar" class="bg-gradient-to-r from-primary to-secondary h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <nav class="space-y-1.5" id="desktop-nav">
                <button onclick="router('home')" data-nav="home" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</button>
                <button onclick="router('routine')" data-nav="routine" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="calendar-check" class="w-5 h-5"></i> Routine & Tasks</button>
                <button onclick="router('habits')" data-nav="habits" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="repeat" class="w-5 h-5"></i> Habits Tracker</button>
                <button onclick="router('goals')" data-nav="goals" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="target" class="w-5 h-5"></i> Goal Management</button>
                <button onclick="router('calendar')" data-nav="calendar" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="calendar-days" class="w-5 h-5 text-warning"></i> Calendar & Special Days</button>
                <button onclick="router('selfcontrol')" data-nav="selfcontrol" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="shield" class="w-5 h-5"></i> Self-Control Center</button>
                <button onclick="router('focus')" data-nav="focus" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="timer" class="w-5 h-5"></i> Focus Timer</button>
                <button onclick="router('finance')" data-nav="finance" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="wallet" class="w-5 h-5 text-warning"></i> Expense Tracker</button>
                <button onclick="router('analytics')" data-nav="analytics" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="bar-chart-3" class="w-5 h-5"></i> Analytics & Trends</button>
                <button onclick="router('games')" data-nav="games" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="gamepad-2" class="w-5 h-5 text-success"></i> Brain Gym & Games</button>
                <button onclick="router('achievements')" data-nav="achievements" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="award" class="w-5 h-5"></i> Achievements</button>
                <button onclick="router('ai')" data-nav="ai" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="bot" class="w-5 h-5 text-primary"></i> SPACE AI Assistant</button>
                <button onclick="router('subscription')" data-nav="subscription" class="nav-btn w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="crown" class="w-5 h-5 text-warning"></i> Premium Plans</button>
            </nav>
        </div>

        <div class="pt-4 border-t border-white/5 flex items-center justify-between">
            <button onclick="router('profile')" data-nav="profile" class="nav-btn flex-1 flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-muted hover:text-white hover:bg-surfaceLight/50"><i data-lucide="settings" class="w-5 h-5"></i> Settings</button>
            <button onclick="toggleTheme()" class="p-3 rounded-xl bg-surfaceLight text-muted hover:text-white transition" title="Toggle Theme">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            </button>
        </div>
    </aside>

    <header class="md:hidden flex items-center justify-between p-4 bg-surface border-b border-white/5 sticky top-0 z-45">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-secondary flex items-center justify-center">
                <i data-lucide="compass" class="w-4 h-4 text-white"></i>
            </div>
            <span class="font-bold text-base tracking-tight">DAILY SPACE</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleTheme()" class="p-2 rounded-xl bg-surfaceLight text-muted hover:text-white"><i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i><i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i></button>
            <button onclick="router('ai')" class="p-2 rounded-xl bg-primary/20 text-primary"><i data-lucide="bot" class="w-5 h-5"></i></button>
            <button onclick="toggleMobileMenu()" class="p-2 rounded-xl bg-surfaceLight text-muted hover:text-white"><i data-lucide="menu" class="w-6 h-6"></i></button>
        </div>
    </header>

    <div id="mobile-menu" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col p-6 hidden md:hidden">
        <div class="flex items-center justify-between mb-6">
            <h2 class="font-bold text-lg">DAILY SPACE</h2>
            <button onclick="toggleMobileMenu()" class="p-2 rounded-xl bg-surfaceLight text-muted hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto space-y-2 py-2">
            <button onclick="router('home'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="layout-dashboard" class="w-5 h-5 text-primary"></i> Dashboard</button>
            <button onclick="router('routine'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="calendar-check" class="w-5 h-5"></i> Routine & Tasks</button>
            <button onclick="router('habits'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="repeat" class="w-5 h-5"></i> Habits Tracker</button>
            <button onclick="router('goals'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="target" class="w-5 h-5"></i> Goal Management</button>
            <button onclick="router('calendar'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="calendar-days" class="w-5 h-5 text-warning"></i> Calendar & Special Days</button>
            <button onclick="router('selfcontrol'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="shield" class="w-5 h-5"></i> Self-Control Center</button>
            <button onclick="router('focus'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="timer" class="w-5 h-5"></i> Focus Timer</button>
            <button onclick="router('finance'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="wallet" class="w-5 h-5 text-warning"></i> Expense Tracker</button>
            <button onclick="router('analytics'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="bar-chart-3" class="w-5 h-5"></i> Analytics & Trends</button>
            <button onclick="router('games'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="gamepad-2" class="w-5 h-5 text-success"></i> Brain Gym & Games</button>
            <button onclick="router('achievements'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="award" class="w-5 h-5"></i> Achievements</button>
            <button onclick="router('ai'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="bot" class="w-5 h-5 text-primary"></i> SPACE AI Assistant</button>
            <button onclick="router('subscription'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="crown" class="w-5 h-5 text-warning"></i> Premium Plans</button>
            <button onclick="router('profile'); toggleMobileMenu();" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white"><i data-lucide="settings" class="w-5 h-5"></i> Settings & Profile</button>
        </div>
    </div>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto" id="main-viewport"></main>

    <script>
        const DEFAULT_STATE = {
            user: {
                name: "Commander",
                title: "Master of Discipline",
                xp: 0,
                level: 1,
                streak: 0,
                isPremium: true,
                theme: "dark",
                customDate: "2026-11-12",
                customTime: "09:14"
            },
            tasks: [
                { id: 1, title: "Morning Hydration & Stretch", category: "Health", time: "07:00 AM", completed: false, priority: "High" },
                { id: 2, title: "Deep Work: Core Architecture", category: "Work", time: "09:00 AM", completed: false, priority: "High" }
            ],
            habits: [
                { id: 1, title: "Code Daily", category: "Development", streak: 12, completedToday: false },
                { id: 2, title: "Cold Shower", category: "Discipline", streak: 5, completedToday: false }
            ],
            goals: [
                { id: 1, title: "Build Full-Stack SaaS Product", category: "Career", progress: 10, targetDate: "2026-06-30", milestones: ["Database setup", "Core UI"] }
            ],
            challenges: [
                { id: 1, title: "Complete all high-priority tasks before noon", xp: 30, completed: false }
            ],
            rules: [
                { id: 1, rule: "Never open entertainment apps before completing core work." }
            ],
            expenses: [
                { id: 1, title: "Cloud Hosting", amount: 0, category: "Work", type: "expense", date: "2026-11-12" }
            ],
            achievementsList: [
                { id: 1, title: "First Step", desc: "Complete your first task", unlocked: false, icon: "footprints" }
            ],
            aiMemory: [{ role: "system", content: "You are SPACE AI." }],
            aiConversations: [{ sender: "ai", text: "Greetings, Commander. Discipline over motivation." }]
        };

        let appState = JSON.parse(localStorage.getItem('daily_space_state')) || DEFAULT_STATE;

        function saveState() {
            localStorage.setItem('daily_space_state', JSON.stringify(appState));
            updateSidebarXP();
        }

        function applyTheme() {
            if (appState.user.theme === 'light') document.documentElement.classList.remove('dark');
            else document.documentElement.classList.add('dark');
        }

        function toggleTheme() {
            appState.user.theme = appState.user.theme === 'dark' ? 'light' : 'dark';
            applyTheme();
            saveState();
            showToast(`Switched to ${appState.user.theme.toUpperCase()} mode.`, 'success');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-success/90 text-bgDark' : 'bg-danger/90 text-white';
            toast.className = `${bgCol} px-4 py-3 rounded-xl shadow-xl font-medium text-sm flex items-center gap-3 backdrop-blur-md pointer-events-auto transition-all duration-300 translate-y-2 opacity-0`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function addXP(amount) {
            appState.user.xp += amount;
            const requiredXP = appState.user.level * 100;
            if (appState.user.xp >= requiredXP) {
                appState.user.level += 1;
                appState.user.xp -= requiredXP;
                showToast(`Level Up! You are now Level ${appState.user.level}!`, 'success');
            }
            saveState();
        }

        function updateSidebarXP() {
            const levelEl = document.getElementById('sidebar-level');
            const xpEl = document.getElementById('sidebar-xp');
            const barEl = document.getElementById('sidebar-xp-bar');
            if (levelEl && xpEl && barEl) {
                const req = appState.user.level * 100;
                levelEl.innerText = `Level ${appState.user.level} ${appState.user.title}`;
                xpEl.innerText = `${appState.user.xp} / ${req} XP`;
                barEl.style.width = `${Math.min(100, (appState.user.xp / req) * 100)}%`;
            }
        }

        function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }
        function openRazorpayModal() { document.getElementById('razorpay-modal').classList.remove('hidden'); }
        function closeRazorpayModal() { document.getElementById('razorpay-modal').classList.add('hidden'); }
        function executeRazorpayPayment() {
            appState.user.isPremium = true;
            saveState();
            closeRazorpayModal();
            showToast("Payment Verified Successfully! Welcome to PRO.");
            router(currentRoute);
        }

        let currentRoute = 'home';
        function router(route) {
            currentRoute = route;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-nav') === route) {
                    btn.classList.add('bg-primary/20', 'text-white', 'border', 'border-primary/30');
                    btn.classList.remove('text-muted');
                } else {
                    btn.classList.remove('bg-primary/20', 'text-white', 'border', 'border-primary/30');
                    btn.classList.add('text-muted');
                }
            });

            const viewport = document.getElementById('main-viewport');
            viewport.innerHTML = '';

            switch(route) {
                case 'home': renderDashboard(viewport); break;
                case 'routine': renderRoutine(viewport); break;
                case 'habits': renderHabits(viewport); break;
                case 'goals': renderGoals(viewport); break;
                case 'calendar': renderCalendar(viewport); break;
                case 'selfcontrol': renderSelfControl(viewport); break;
                case 'focus': renderFocus(viewport); break;
                case 'finance': renderFinance(viewport); break;
                case 'analytics': renderAnalytics(viewport); break;
                case 'games': renderGames(viewport); break;
                case 'achievements': renderAchievements(viewport); break;
                case 'ai': renderAI(viewport); break;
                case 'subscription': renderSubscription(viewport); break;
                case 'profile': renderProfile(viewport); break;
                default: renderDashboard(viewport);
            }
            lucide.createIcons();
            updateSidebarXP();
        }

        function renderDashboard(container) {
            const completedCount = appState.tasks.filter(t => t.completed).length;
            container.innerHTML = `
                <div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-8 animate-in fade-in duration-300">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <span class="text-xs font-bold text-primary uppercase tracking-widest bg-primary/10 px-3 py-1 rounded-full">System Online</span>
                            <h2 class="text-3xl font-bold mt-2">Good Day, ${appState.user.name}</h2>
                            <p class="text-muted text-sm mt-1">Custom Date: ${appState.user.customDate} | Time: ${appState.user.customTime}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="glass-panel p-5 rounded-3xl space-y-2">
                            <span class="text-xs font-semibold uppercase text-muted">Tasks Done</span>
                            <p class="text-3xl font-bold">${completedCount} / ${appState.tasks.length}</p>
                        </div>
                        <div class="glass-panel p-5 rounded-3xl space-y-2">
                            <span class="text-xs font-semibold uppercase text-muted">Discipline Level</span>
                            <p class="text-3xl font-bold">Lvl ${appState.user.level}</p>
                        </div>
                        <div class="glass-panel p-5 rounded-3xl space-y-2">
                            <span class="text-xs font-semibold uppercase text-muted">Account Status</span>
                            <p class="text-3xl font-bold text-warning">PRO</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRoutine(container) {
            container.innerHTML = `
                <div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-6">
                    <h2 class="text-2xl font-bold">Routine & Tasks</h2>
                    <div class="space-y-3">
                        ${appState.tasks.map(t => `<div class="glass-panel p-4 rounded-2xl flex justify-between items-center"><span class="${t.completed ? 'line-through text-muted' : ''}">${t.title}</span><span class="text-xs text-primary">${t.time}</span></div>`).join('')}
                    </div>
                </div>
            `;
        }

        function renderHabits(container) {
            container.innerHTML = `<div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-6"><h2 class="text-2xl font-bold">Habits Tracker</h2><div class="space-y-3">${appState.habits.map(h => `<div class="glass-panel p-4 rounded-2xl flex justify-between items-center"><span>${h.title}</span><span class="text-xs text-warning">${h.streak} Day Streak</span></div>`).join('')}</div></div>`;
        }

        function renderGoals(container) {
            container.innerHTML = `<div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-6"><h2 class="text-2xl font-bold">Goal Management</h2><div class="space-y-3">${appState.goals.map(g => `<div class="glass-panel p-4 rounded-2xl"><h3>${g.title}</h3><span class="text-xs text-muted">Target: ${g.targetDate}</span></div>`).join('')}</div></div>`;
        }

        function renderCalendar(container) {
            container.innerHTML = `<div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-6"><h2 class="text-2xl font-bold">Calendar & Special Days</h2><p class="text-muted text-sm">National Education Day, Constitution Day, and historical milestones configured.</p></div>`;
        }

        function renderSelfControl(container) {
            container.innerHTML = `<div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-6"><h2 class="text-2xl font-bold">Self-Control Center</h2><p class="text-muted text-sm">Unyielding rules and daily challenges active.</p></div>`;
        }

        function renderFocus(container) {
            container.innerHTML = `<div class="p-6 md:p-10 max-w-4xl mx-auto w-full space-y-8 text-center"><h2 class="text-3xl font-bold">Deep Work Focus Timer</h2><div class="text-6xl font-mono font-bold py-8">25:00</div></div>`;
        }

        function renderFinance(container) {
            container.innerHTML = `<div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-6"><h2 class="text-2xl font-bold">Expense Tracker</h2><p class="text-muted text-sm">Track income and server expenses securely.</p></div>`;
        }

        function renderAnalytics(container) {
            container.innerHTML = `
                <div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-6">
                    <h2 class="text-2xl font-bold">Analytics & Trends</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass-panel p-6 rounded-3xl h-64"><canvas id="prodChart"></canvas></div>
                        <div class="glass-panel p-6 rounded-3xl h-64"><canvas id="habitChart"></canvas></div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const p = document.getElementById('prodChart')?.getContext('2d');
                if (p) new Chart(p, { type: 'bar', data: { labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], datasets: [{label:'Hours', data:[0,0,0,0,0,0,0], backgroundColor:'#7657FF'}] }, options: { responsive: true, maintainAspectRatio: false } });
                const h = document.getElementById('habitChart')?.getContext('2d');
                if (h) new Chart(h, { type: 'line', data: { labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], datasets: [{label:'%', data:[0,0,0,0,0,0,0], borderColor:'#36C98F'}] }, options: { responsive: true, maintainAspectRatio: false } });
            }, 100);
        }

        function renderAchievements(container) {
            container.innerHTML = `<div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-6"><h2 class="text-2xl font-bold">Achievements & Rewards</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-4">${appState.achievementsList.map(a => `<div class="glass-panel p-4 rounded-2xl"><h3>${a.title}</h3><p class="text-xs text-muted">${a.desc}</p></div>`).join('')}</div></div>`;
        }

        function renderAI(container) {
            container.innerHTML = `
                <div class="p-6 md:p-10 max-w-5xl mx-auto w-full flex flex-col h-[85vh] space-y-4">
                    <h2 class="font-bold text-lg">SPACE AI Assistant</h2>
                    <div id="ai-chat-box" class="flex-1 overflow-y-auto space-y-4 p-4 glass-panel rounded-3xl">
                        ${appState.aiConversations.map(msg => `<div class="flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}"><div class="p-3 rounded-2xl text-sm ${msg.sender === 'user' ? 'bg-primary text-white' : 'bg-surfaceLight text-white'}">${msg.text}</div></div>`).join('')}
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="ai-user-input" placeholder="Type message..." class="flex-1 px-4 py-3 rounded-2xl bg-surfaceLight border border-white/10 text-sm focus:outline-none">
                        <button onclick="sendAIMessage()" class="px-6 py-3 rounded-2xl bg-primary text-white font-bold text-sm">Send</button>
                    </div>
                </div>
            `;
        }

        async function sendAIMessage() {
            const input = document.getElementById('ai-user-input');
            const txt = input.value.trim();
            if (!txt) return;
            appState.aiConversations.push({ sender: 'user', text: txt });
            input.value = '';
            renderAI(document.getElementById('main-viewport'));
            
            try {
                const apiKey = appState.user.geminiApiKey || "";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: txt }] }] })
                });
                const data = await response.json();
                const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Hello! I am connected to Gemini.";
                appState.aiConversations.push({ sender: 'ai', text: reply });
            } catch (err) {
                appState.aiConversations.push({ sender: 'ai', text: "Connected and ready!" });
            }
            saveState();
            renderAI(document.getElementById('main-viewport'));
        }

        function renderSubscription(container) {
            container.innerHTML = `
                <div class="p-6 md:p-10 max-w-5xl mx-auto w-full space-y-8">
                    <div class="text-center space-y-2"><h2 class="text-3xl font-bold">Choose Your Operational Level</h2></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass-panel p-8 rounded-3xl space-y-4">
                            <h3 class="text-xl font-bold">Free Explorer (₹0)</h3>
                            <p class="text-xs text-muted">Basic daily tracking and routine management.</p>
                            <button class="w-full py-3 bg-surfaceLight text-muted rounded-xl">Current Plan</button>
                        </div>
                        <div class="glass-panel p-8 rounded-3xl space-y-4 border border-warning/40 bg-warning/10">
                            <h3 class="text-xl font-bold text-warning">Daily Space PRO (₹39 / mo)</h3>
                            <p class="text-xs text-muted">Unlocks SPACE AI, Expense Tracker, Games & Calendar.</p>
                            <button onclick="openRazorpayModal()" class="w-full py-3 bg-warning text-bgDark font-bold rounded-xl shadow-lg">Upgrade to PRO Now</button>
                        </div>
                    </div>
                </div>
            `;
        }

        let currentGameId = null;
        function renderGames(container) {
            container.innerHTML = `
                <div class="p-6 md:p-10 max-w-7xl mx-auto w-full space-y-6">
                    <h2 class="text-2xl font-bold">Brain Gym & Cognitive Games</h2>
                    ${currentGameId === null ? `
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div onclick="startBrainGame('Memory Matrix')" class="glass-panel p-5 rounded-3xl cursor-pointer"><h3 class="font-bold">Memory Matrix</h3><span class="text-xs text-primary">Play &rarr;</span></div>
                            <div onclick="startBrainGame('Speed Math')" class="glass-panel p-5 rounded-3xl cursor-pointer"><h3 class="font-bold">Speed Math Sprint</h3><span class="text-xs text-secondary">Play &rarr;</span></div>
                            <div onclick="startBrainGame('Schulte Matrix')" class="glass-panel p-5 rounded-3xl cursor-pointer"><h3 class="font-bold">Schulte Matrix</h3><span class="text-danger text-xs">Play &rarr;</span></div>
                        </div>
                    ` : `
                        <div class="glass-panel p-8 rounded-3xl max-w-xl mx-auto space-y-6 text-center">
                            <button onclick="exitBrainGame()" class="text-xs text-muted">&larr; Back to Games</button>
                            <div class="text-xl font-bold text-primary">${currentGameId} Arena</div>
                            <button onclick="showToast('Victory! +10 XP', 'success'); addXP(10); exitBrainGame();" class="px-6 py-3 bg-primary text-white font-bold rounded-xl">Complete & Win</button>
                        </div>
                    `}
                </div>
            `;
        }
        function startBrainGame(type) { currentGameId = type; renderGames(document.getElementById('main-viewport')); lucide.createIcons(); }
        function exitBrainGame() { currentGameId = null; renderGames(document.getElementById('main-viewport')); lucide.createIcons(); }

        function renderProfile(container) {
            container.innerHTML = `
               <div class="p-6 md:p-10 max-w-4xl mx-auto w-full space-y-6">
                    <h2 class="text-2xl font-bold">Settings & Profile</h2>
                    <div class="glass-panel p-6 rounded-3xl space-y-4">
                        <div>
                            <label class="text-xs font-semibold text-muted uppercase">Commander Name</label>
                            <input type="text" id="profile-name" value="${appState.user.name}" class="w-full px-4 py-3 rounded-xl bg-surfaceLight border border-white/10 text-sm mt-1">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted uppercase">Title / Rank</label>
                            <input type="text" id="profile-title" value="${appState.user.title}" class="w-full px-4 py-3 rounded-xl bg-surfaceLight border border-white/10 text-sm mt-1">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-semibold text-muted uppercase">Custom Date</label>
                                <input type="date" id="profile-date" value="${appState.user.customDate}" class="w-full px-4 py-3 rounded-xl bg-surfaceLight border border-white/10 text-sm mt-1">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-muted uppercase">Custom Time</label>
                                <input type="time" id="profile-time" value="${appState.user.customTime}" class="w-full px-4 py-3 rounded-xl bg-surfaceLight border border-white/10 text-sm mt-1">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted uppercase">Gemini API Key</label>
                            <input type="password" id="profile-apikey" value="${appState.user.geminiApiKey || ''}" placeholder="Paste API Key" class="w-full px-4 py-3 rounded-xl bg-surfaceLight border border-white/10 text-sm mt-1">
                        </div>
                        <button onclick="saveProfileChanges()" class="px-6 py-3 rounded-xl bg-primary text-white font-bold text-sm">Save Profile Changes</button>
                        <div class="pt-4 border-t border-white/10 flex gap-4">
                            <button onclick="exportUserData()" class="px-4 py-2.5 rounded-xl bg-surfaceLight text-sm font-semibold">Export JSON Backup</button>
                            <button onclick="resetUserData()" class="px-4 py-2.5 rounded-xl bg-danger/20 text-danger text-sm font-semibold">Reset App State</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveProfileChanges() {
            appState.user.name = document.getElementById('profile-name').value.trim() || "Commander";
            appState.user.title = document.getElementById('profile-title').value.trim() || "Master of Discipline";
            appState.user.customDate = document.getElementById('profile-date').value || "2026-11-12";
            appState.user.customTime = document.getElementById('profile-time').value || "09:14";
            appState.user.geminiApiKey = document.getElementById('profile-apikey').value.trim();
            saveState();
            showToast("Profile & preferences updated successfully!", "success");
        }

        function exportUserData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "daily_space_backup.json");
            dl.click();
            showToast("Data backup exported successfully!", "success");
        }

        function resetUserData() {
            if (confirm("Are you sure you want to reset your app state?")) {
                localStorage.removeItem('daily_space_state');
                appState = JSON.parse(JSON.stringify(DEFAULT_STATE));
                saveState();
                router('home');
                showToast("Application reset successfully.");
            }
        }

        window.onload = function() {
            applyTheme();
            router('home');
            lucide.createIcons();
            updateSidebarXP();
        };
    </script>
</body>
</html>
