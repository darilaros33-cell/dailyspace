        let focusTimerInterval = null;
        let focusSecondsRemaining = 25 * 60;
        let isFocusRunning = false;
        let focusModeType = 'work';

        function renderFocus(container) {
            const mins = String(Math.floor(focusSecondsRemaining / 60)).padStart(2, '0');
            const secs = String(focusSecondsRemaining % 60).padStart(2, '0');

            container.innerHTML = `

                        <p class="text-muted text-sm">Timestamp-backed robust focus session engine.</p>

                        <div class="text-6xl md:text-7xl font-extrabold tracking-wider font-mono text-white" id="timer-display">
                            ${mins}:${secs}
                        </div>
                        <div class="flex items-center gap-3 w-full">
                            <button onclick="toggleFocusTimer()" id="timer-toggle-btn" class="flex-1 py-3.5 rounded-2xl bg-primary hover:bg-primaryHover text-white font-bold text-sm transition shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                                <i data-lucide="${isFocusRunning ? 'pause' : 'play'}" class="w-4 h-4"></i> ${isFocusRunning ? 'PAUSE' : 'START FOCUS'}
                            </button>
                            <button onclick="resetFocusTimer()" class="px-4 py-3.5 rounded-2xl bg-surfaceLight hover:bg-surfaceLight/80 text-white font-semibold text-sm transition">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="flex gap-2 w-full pt-2 border-t border-white/5">
                            <button onclick="setFocusDuration(15)" class="flex-1 py-2 rounded-xl bg-surfaceLight/50 text-xs font-semibold hover:bg-surfaceLight">15m</button>
                            <button onclick="setFocusDuration(25)" class="flex-1 py-2 rounded-xl bg-surfaceLight/50 text-xs font-semibold hover:bg-surfaceLight">25m</button>
                            <button onclick="setFocusDuration(45)" class="flex-1 py-2 rounded-xl bg-surfaceLight/50 text-xs font-semibold hover:bg-surfaceLight">45m</button>
                            <button onclick="setFocusDuration(60)" class="flex-1 py-2 rounded-xl bg-surfaceLight/50 text-xs font-semibold hover:bg-surfaceLight">60m</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleFocusTimer() {
            if (isFocusRunning) {
                clearInterval(focusTimerInterval);
                isFocusRunning = false;
            } else {
                isFocusRunning = true;
                const endTime = Date.now() + focusSecondsRemaining * 1000;
                focusTimerInterval = setInterval(() => {
                    focusSecondsRemaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
                    const mins = String(Math.floor(focusSecondsRemaining / 60)).padStart(2, '0');
                    const secs = String(focusSecondsRemaining % 60).padStart(2, '0');
                    const display = document.getElementById('timer-display');
                    if (display) display.innerText = `${mins}:${secs}`;

                    if (focusSecondsRemaining <= 0) {
                        clearInterval(focusTimerInterval);
                        isFocusRunning = false;
                        addXP(15);
                        showToast("Focus session completed! +15 XP", "success");
                        focusSecondsRemaining = 25 * 60;
                        renderFocus(document.getElementById('main-viewport'));
                        lucide.createIcons();
                    }
                }, 1000);
            }
            renderFocus(document.getElementById('main-viewport'));
            lucide.createIcons();
        }

        function resetFocusTimer() {
            clearInterval(focusTimerInterval);
            isFocusRunning = false;
            focusSecondsRemaining = 25 * 60;
            renderFocus(document.getElementById('main-viewport'));
            lucide.createIcons();
        }

async function saveAIPersonalMemory(userMessage) {
    if (!window.dailySpaceAI?.model || !userMessage) return;

    try {
        const prompt = `
You are the personal memory manager for SPACE AI.

Read the user's message and identify useful, long-term facts
that the user explicitly shared about themselves.

Only save facts such as:
- Name or preferred name
- Favourite apps or interests
- Personal goals
- Ongoing projects
- General preferences

NEVER save:
- Passwords or login details
- Contact details or precise location
- Health or mental health information
- Financial or account information
- Religion or political beliefs
- Sexual or other highly private information
- Temporary or unimportant conversation details

Do not guess or make assumptions.
Only use facts explicitly stated by the user.
If there are no suitable facts, return an empty array.

Return ONLY a valid JSON array of short strings.
Example: ["The user's favourite app is Daily Space."]

USER MESSAGE:
${JSON.stringify(userMessage)}
`;

        const result =
            await window.dailySpaceAI.model.generateContent(prompt);

        let responseText = result.response.text().trim();

        responseText = responseText
            .replace(/^```(?:json)?\s*/i, '')
            .replace(/\s*```$/, '')
            .trim();

        const extractedMemories = JSON.parse(responseText);

        if (!Array.isArray(extractedMemories)) return;

        const existingMemories = Array.isArray(appState.aiPersonalMemory)
            ? appState.aiPersonalMemory
            : [];

        const combinedMemories = [
            ...existingMemories,
            ...extractedMemories
                .filter(item => typeof item === 'string')
                .map(item => item.trim().slice(0, 160))
                .filter(Boolean)
        ];

        const uniqueMemories = [];
        const seen = new Set();

        for (const memory of combinedMemories) {
            const key = memory.toLowerCase();

            if (!seen.has(key)) {
                seen.add(key);
                uniqueMemories.push(memory);
            }
        }

        // Keep the 30 most recent unique memories
        appState.aiPersonalMemory = uniqueMemories.slice(-30);

        saveState();

    } catch (error) {
        console.warn('SPACE AI Memory Error:', error);
    }
    }
        

async function sendAIMessage() {
    const input = document.getElementById('ai-user-input');
    if (!input) return;

    const txt = input.value.trim();
    if (!txt) return;

    if (window.dailySpaceAI?.isBusy) return;

    if (!window.dailySpaceAI?.model) {
        alert('SPACE AI is not initialized. Please refresh the app.');
        return;
    }

    window.dailySpaceAI.isBusy = true;

    const thinkingMessage = {
        sender: 'ai',
        text: 'Thinking...'
    };

    // Save the user's message
    appState.aiConversations.push({
        sender: 'user',
        text: txt
    });

    appState.aiMemory.push({
        role: 'user',
        content: txt
    });

    saveState();
    input.value = '';

    appState.aiConversations.push(thinkingMessage);

    renderAI(document.getElementById('main-viewport'));
    lucide.createIcons();

    try {
        // Collect previous conversation memory
        const previousMemory = Array.isArray(appState.aiMemory)
            ? appState.aiMemory
                .slice(0, -1)
                .filter(item =>
                    item.role === 'user' ||
                    item.role === 'assistant'
                )
                .slice(-20)
            : [];

        // Format previous messages as readable context
        const memoryContext = previousMemory
            .map(item =>
                `${item.role === 'user' ? 'User' : 'SPACE AI'}: ${item.content}`
            )
            .join('\n');

        // Create a new Gemini chat session if needed
        const isNewSession = !window.dailySpaceAI.chat;

        if (isNewSession) {
            window.dailySpaceAI.chat =
                window.dailySpaceAI.model.startChat();
        }

        // Load saved personal memories
const personalMemories = Array.isArray(appState.aiPersonalMemory)
    ? appState.aiPersonalMemory
    : [];

const personalMemoryContext = personalMemories.length > 0
    ? personalMemories.map(item => `- ${item}`).join('\n')
    : 'No saved personal memories yet.';

// Build context for a new Gemini session
const messageToSend = isNewSession
    ? `You are SPACE AI.

Here are important personal details the user previously shared:
${personalMemoryContext}

Here is the previous conversation:
${memoryContext || 'No previous conversation.'}

Use this information naturally when relevant.
Never invent personal details.

CURRENT MESSAGE:
${txt}`
    : txt;

        // Send message to Gemini
        const result =
            await window.dailySpaceAI.chat.sendMessage(messageToSend);

        const aiReply =
            result.response.text() ||
            'I received an empty response. Please try again.';

        appState.aiConversations.push({
    sender: 'ai',
    text: aiReply
});

appState.aiMemory.push({
    role: 'assistant',
    content: aiReply
});

saveState();

// Extract and save important personal details
await saveAIPersonalMemory(txt);

    } catch (error) {
        console.error('SPACE AI Error:', error);

        appState.aiConversations.push({
            sender: 'ai',
            text: `SPACE AI Error: ${error?.message || error}`
        });

    } finally {
        const thinkingIndex =
            appState.aiConversations.indexOf(thinkingMessage);

        if (thinkingIndex !== -1) {
            appState.aiConversations.splice(thinkingIndex, 1);
        }

        window.dailySpaceAI.isBusy = false;

        renderAI(document.getElementById('main-viewport'));
        lucide.createIcons();
    }
}
